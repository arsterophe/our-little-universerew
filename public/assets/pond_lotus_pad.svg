<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="100%" height="100%">
  <defs>
    <radialGradient id="lotusPadGrad" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#166534" />
      <stop offset="90%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <radialGradient id="lotusBlossomGrad" cx="50%" cy="60%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fdf4ff" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </radialGradient>
    <filter id="padGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Lotus Pad with C-Notch -->
  <path d="M 60 78 C 30 78, 8 62, 8 44 C 8 26, 32 10, 60 10 C 88 10, 112 26, 112 44 C 112 62, 90 78, 60 78 Z" fill="url(#lotusPadGrad)" opacity="0.9" />
  <!-- Lily Pad Radial Veins -->
  <path d="M 60 44 L 20 30 M 60 44 L 25 56 M 60 44 L 55 12 M 60 44 L 80 15 M 60 44 L 98 32 M 60 44 L 95 58 M 60 44 L 62 76" stroke="#22c55e" stroke-width="1.2" opacity="0.45" />

  <!-- Luminous Water Lily Flower in Center -->
  <g class="lotus-flower" filter="url(#padGlow)" transform="translate(60, 42)">
    <!-- Outer Petals -->
    <path d="M 0 0 C -14 -6, -22 -18, -12 -28 C -4 -22, -2 -8, 0 0 Z" fill="url(#lotusBlossomGrad)" opacity="0.95" />
    <path d="M 0 0 C 14 -6, 22 -18, 12 -28 C 4 -22, 2 -8, 0 0 Z" fill="url(#lotusBlossomGrad)" opacity="0.95" />
    <path d="M 0 0 C -8 -12, -8 -26, 0 -34 C 8 -26, 8 -12, 0 0 Z" fill="url(#lotusBlossomGrad)" />
    <!-- Inner Radiant Core -->
    <circle cx="0" cy="-8" r="4.5" fill="#fef08a" />
  </g>
</svg>

