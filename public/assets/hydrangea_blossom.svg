<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <defs>
    <!-- Foliage Gradients -->
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Petal Gradients -->
    <radialGradient id="petBlue" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="45%" stop-color="#60a5fa" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <radialGradient id="petLavender" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#581c87" />
    </radialGradient>
    <radialGradient id="petPurple" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="85%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>
    <radialGradient id="petPink" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="45%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>
    <radialGradient id="petWhite" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="90%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <!-- Glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Serrated Hydrangea Leaves in Background -->
  <g class="hydrangea-leaves">
    <!-- Left Leaf -->
    <path d="M 120 180 C 70 190, 20 160, 10 120 C 15 90, 60 70, 110 95 C 105 130, 115 160, 120 180 Z" fill="url(#leafGrad1)" opacity="0.9" />
    <path d="M 10 120 Q 65 110 115 125" stroke="#34d399" stroke-width="1.8" fill="none" opacity="0.6" />
    
    <!-- Right Leaf -->
    <path d="M 180 180 C 230 190, 280 160, 290 120 C 285 90, 240 70, 190 95 C 195 130, 185 160, 180 180 Z" fill="url(#leafGrad2)" opacity="0.9" />
    <path d="M 290 120 Q 235 110 185 125" stroke="#34d399" stroke-width="1.8" fill="none" opacity="0.6" />

    <!-- Bottom Center Leaves -->
    <path d="M 150 170 C 120 220, 80 250, 40 240 C 50 200, 100 185, 140 175 Z" fill="url(#leafGrad2)" opacity="0.85" />
    <path d="M 150 170 C 180 220, 220 250, 260 240 C 250 200, 200 185, 160 175 Z" fill="url(#leafGrad1)" opacity="0.85" />
  </g>

  <!-- Fluffy Inflorescence Head: Detailed 4-Petal Florets -->
  <g class="hydrangea-florets" filter="url(#softGlow)">
    <!-- Floret Template macro replicated with varied rotations and positions -->
    <!-- LAYER 1 (Outer perimeter florets) -->
    <g transform="translate(70, 80) rotate(15) scale(0.85)">
      <circle cx="-10" cy="0" r="9" fill="url(#petBlue)" />
      <circle cx="10" cy="0" r="9" fill="url(#petBlue)" />
      <circle cx="0" cy="-10" r="9" fill="url(#petBlue)" />
      <circle cx="0" cy="10" r="9" fill="url(#petBlue)" />
      <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
    </g>
    <g transform="translate(105, 50) rotate(-20) scale(0.9)">
      <circle cx="-10" cy="0" r="9" fill="url(#petLavender)" />
      <circle cx="10" cy="0" r="9" fill="url(#petLavender)" />
      <circle cx="0" cy="-10" r="9" fill="url(#petLavender)" />
      <circle cx="0" cy="10" r="9" fill="url(#petLavender)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
    <g transform="translate(150, 35) rotate(5) scale(0.95)">
      <circle cx="-10" cy="0" r="9.5" fill="url(#petWhite)" />
      <circle cx="10" cy="0" r="9.5" fill="url(#petWhite)" />
      <circle cx="0" cy="-10" r="9.5" fill="url(#petWhite)" />
      <circle cx="0" cy="10" r="9.5" fill="url(#petWhite)" />
      <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
    </g>
    <g transform="translate(195, 50) rotate(25) scale(0.9)">
      <circle cx="-10" cy="0" r="9" fill="url(#petPurple)" />
      <circle cx="10" cy="0" r="9" fill="url(#petPurple)" />
      <circle cx="0" cy="-10" r="9" fill="url(#petPurple)" />
      <circle cx="0" cy="10" r="9" fill="url(#petPurple)" />
      <circle cx="0" cy="0" r="2.5" fill="#fde047" />
    </g>
    <g transform="translate(230, 80) rotate(-10) scale(0.85)">
      <circle cx="-10" cy="0" r="9" fill="url(#petPink)" />
      <circle cx="10" cy="0" r="9" fill="url(#petPink)" />
      <circle cx="0" cy="-10" r="9" fill="url(#petPink)" />
      <circle cx="0" cy="10" r="9" fill="url(#petPink)" />
      <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
    </g>

    <!-- LAYER 2 (Mid-depth florets) -->
    <g transform="translate(55, 120) rotate(-35) scale(0.9)">
      <circle cx="-10" cy="0" r="9.5" fill="url(#petBlue)" />
      <circle cx="10" cy="0" r="9.5" fill="url(#petBlue)" />
      <circle cx="0" cy="-10" r="9.5" fill="url(#petBlue)" />
      <circle cx="0" cy="10" r="9.5" fill="url(#petBlue)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
    <g transform="translate(95, 95) rotate(40) scale(1)">
      <circle cx="-11" cy="0" r="10" fill="url(#petBlue)" />
      <circle cx="11" cy="0" r="10" fill="url(#petBlue)" />
      <circle cx="0" cy="-11" r="10" fill="url(#petBlue)" />
      <circle cx="0" cy="11" r="10" fill="url(#petBlue)" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
    <g transform="translate(140, 75) rotate(-15) scale(1.05)">
      <circle cx="-11" cy="0" r="10.5" fill="url(#petLavender)" />
      <circle cx="11" cy="0" r="10.5" fill="url(#petLavender)" />
      <circle cx="0" cy="-11" r="10.5" fill="url(#petLavender)" />
      <circle cx="0" cy="11" r="10.5" fill="url(#petLavender)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
    <g transform="translate(185, 85) rotate(30) scale(1)">
      <circle cx="-11" cy="0" r="10" fill="url(#petPurple)" />
      <circle cx="11" cy="0" r="10" fill="url(#petPurple)" />
      <circle cx="0" cy="-11" r="10" fill="url(#petPurple)" />
      <circle cx="0" cy="11" r="10" fill="url(#petPurple)" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
    <g transform="translate(240, 115) rotate(15) scale(0.9)">
      <circle cx="-10" cy="0" r="9.5" fill="url(#petLavender)" />
      <circle cx="10" cy="0" r="9.5" fill="url(#petLavender)" />
      <circle cx="0" cy="-10" r="9.5" fill="url(#petLavender)" />
      <circle cx="0" cy="10" r="9.5" fill="url(#petLavender)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- LAYER 3 (Front Core Florets - Focal Point) -->
    <g transform="translate(80, 150) rotate(-10) scale(1.05)">
      <circle cx="-11" cy="0" r="10.5" fill="url(#petBlue)" />
      <circle cx="11" cy="0" r="10.5" fill="url(#petBlue)" />
      <circle cx="0" cy="-11" r="10.5" fill="url(#petBlue)" />
      <circle cx="0" cy="11" r="10.5" fill="url(#petBlue)" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
    <g transform="translate(125, 125) rotate(18) scale(1.15)">
      <circle cx="-12" cy="0" r="11" fill="url(#petLavender)" />
      <circle cx="12" cy="0" r="11" fill="url(#petLavender)" />
      <circle cx="0" cy="-12" r="11" fill="url(#petLavender)" />
      <circle cx="0" cy="12" r="11" fill="url(#petLavender)" />
      <circle cx="0" cy="0" r="3.5" fill="#fef9c3" />
    </g>
    <g transform="translate(170, 120) rotate(-25) scale(1.12)">
      <circle cx="-12" cy="0" r="11" fill="url(#petWhite)" />
      <circle cx="12" cy="0" r="11" fill="url(#petWhite)" />
      <circle cx="0" cy="-12" r="11" fill="url(#petWhite)" />
      <circle cx="0" cy="12" r="11" fill="url(#petWhite)" />
      <circle cx="0" cy="0" r="3.5" fill="#93c5fd" />
    </g>
    <g transform="translate(215, 145) rotate(20) scale(1.05)">
      <circle cx="-11" cy="0" r="10.5" fill="url(#petPurple)" />
      <circle cx="11" cy="0" r="10.5" fill="url(#petPurple)" />
      <circle cx="0" cy="-11" r="10.5" fill="url(#petPurple)" />
      <circle cx="0" cy="11" r="10.5" fill="url(#petPurple)" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>

    <!-- LAYER 4 (Bottom Overlap & Floating Details) -->
    <g transform="translate(115, 175) rotate(35) scale(1)">
      <circle cx="-10" cy="0" r="9.5" fill="url(#petBlue)" />
      <circle cx="10" cy="0" r="9.5" fill="url(#petBlue)" />
      <circle cx="0" cy="-10" r="9.5" fill="url(#petBlue)" />
      <circle cx="0" cy="10" r="9.5" fill="url(#petBlue)" />
      <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
    </g>
    <g transform="translate(160, 168) rotate(-15) scale(1.08)">
      <circle cx="-11" cy="0" r="10.5" fill="url(#petPink)" />
      <circle cx="11" cy="0" r="10.5" fill="url(#petPink)" />
      <circle cx="0" cy="-11" r="10.5" fill="url(#petPink)" />
      <circle cx="0" cy="11" r="10.5" fill="url(#petPink)" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
    <g transform="translate(200, 185) rotate(10) scale(0.95)">
      <circle cx="-10" cy="0" r="9.5" fill="url(#petLavender)" />
      <circle cx="10" cy="0" r="9.5" fill="url(#petLavender)" />
      <circle cx="0" cy="-10" r="9.5" fill="url(#petLavender)" />
      <circle cx="0" cy="10" r="9.5" fill="url(#petLavender)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>

