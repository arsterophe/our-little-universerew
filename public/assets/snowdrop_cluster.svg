<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="100%" height="100%">
  <defs>
    <linearGradient id="snowStemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="snowLeafGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="snowPetalGrad" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="95%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </radialGradient>
    <filter id="lunarChimeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Slender Upright Basal Leaves -->
  <g class="snowdrop-leaves">
    <path d="M 70 255 C 50 180, 20 120, 15 50 C 25 90, 55 170, 75 255 Z" fill="url(#snowLeafGrad)" opacity="0.9" />
    <path d="M 85 255 C 105 170, 135 110, 145 40 C 130 90, 95 180, 80 255 Z" fill="url(#snowLeafGrad)" opacity="0.85" />
    <path d="M 80 255 C 75 160, 65 90, 55 20 C 70 80, 85 160, 85 255 Z" fill="url(#snowLeafGrad)" opacity="0.75" />
  </g>

  <!-- Arching Stems & Nodding Flower Bells -->
  <g class="snowdrop-blossoms" filter="url(#lunarChimeGlow)">
    <!-- FLOWER 1 (Left arching bell) -->
    <path d="M 75 255 C 70 160, 45 90, 35 60 C 30 45, 18 52, 22 70" fill="none" stroke="url(#snowStemGrad)" stroke-width="2.8" stroke-linecap="round" />
    <!-- Ovary (little green pod at junction) -->
    <ellipse cx="22" cy="72" rx="4" ry="3.5" fill="#15803d" />
    <!-- Bell Petals -->
    <g transform="translate(22, 74) rotate(15)">
      <!-- Inner petal with green V marking -->
      <path d="M -3 0 C -4 8, -2 14, 0 16 C 2 14, 4 8, 3 0 Z" fill="#ffffff" stroke="#22c55e" stroke-width="0.8" />
      <!-- Outer lateral petals -->
      <path d="M -2 0 C -8 6, -11 16, -6 22 C -2 18, 0 8, -2 0 Z" fill="url(#snowPetalGrad)" />
      <path d="M 2 0 C 8 6, 11 16, 6 22 C 2 18, 0 8, 2 0 Z" fill="url(#snowPetalGrad)" />
      <!-- Center outer petal -->
      <path d="M 0 0 C -4 7, -5 18, 0 24 C 5 18, 4 7, 0 0 Z" fill="url(#snowPetalGrad)" />
    </g>

    <!-- FLOWER 2 (Right tall graceful bell) -->
    <path d="M 80 255 C 85 150, 105 80, 118 45 C 124 30, 136 38, 132 55" fill="none" stroke="url(#snowStemGrad)" stroke-width="2.8" stroke-linecap="round" />
    <!-- Ovary -->
    <ellipse cx="132" cy="57" rx="4.2" ry="3.8" fill="#15803d" />
    <!-- Bell Petals -->
    <g transform="translate(132, 60) rotate(-18)">
      <path d="M -3 0 C -4 9, -2 15, 0 18 C 2 15, 4 9, 3 0 Z" fill="#ffffff" stroke="#22c55e" stroke-width="0.8" />
      <path d="M -2 0 C -9 7, -12 18, -7 25 C -2 20, 0 9, -2 0 Z" fill="url(#snowPetalGrad)" />
      <path d="M 2 0 C 9 7, 12 18, 7 25 C 2 20, 0 9, 2 0 Z" fill="url(#snowPetalGrad)" />
      <path d="M 0 0 C -5 8, -6 20, 0 27 C 6 20, 5 8, 0 0 Z" fill="url(#snowPetalGrad)" />
    </g>

    <!-- FLOWER 3 (Center nodding bud/half-opened) -->
    <path d="M 78 255 C 80 170, 75 110, 72 85 C 70 70, 82 66, 84 80" fill="none" stroke="url(#snowStemGrad)" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="84" cy="82" rx="3.5" ry="3" fill="#15803d" />
    <g transform="translate(84, 84) rotate(5)">
      <path d="M -2 0 C -6 6, -8 15, -4 20 C -1 16, 0 7, -2 0 Z" fill="url(#snowPetalGrad)" />
      <path d="M 2 0 C 6 6, 8 15, 4 20 C 1 16, 0 7, 2 0 Z" fill="url(#snowPetalGrad)" />
      <path d="M 0 0 C -3 6, -4 16, 0 21 C 4 16, 3 6, 0 0 Z" fill="url(#snowPetalGrad)" />
    </g>
  </g>
</svg>

